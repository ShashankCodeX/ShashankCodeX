name: Test profile generators

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install profile dependencies
        run: python -m pip install -r requirements.txt
      - name: Run profile generator tests
        run: python -m unittest discover -s tests -v
