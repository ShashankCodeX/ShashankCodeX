name: Generate theme-aware profile banner

on:
  push:
    branches:
      - main
    paths:
      - "profile.json"
      - "assets/profile-avatar.png"
      - ".github/scripts/generate_profile.py"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image-processing dependency
        run: python -m pip install -r requirements.txt
      - name: Render dark and light profile banners
        run: python .github/scripts/generate_profile.py
      - name: Publish generated banners
        run: |
          if git diff --quiet -- profile-dark.svg profile-light.svg; then
            echo "Profile banners are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-dark.svg profile-light.svg
          git commit -m "Refresh generated profile banners"
          git push
